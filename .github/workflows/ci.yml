name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package:
          - core
          - api
          - bulk-scanner
          - cli
          - cws-overlay
          - github-action
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install core dependency
        if: matrix.package != 'core' && matrix.package != 'cws-overlay'
        working-directory: packages/core
        run: npm ci

      - name: Build core dependency
        if: matrix.package != 'core' && matrix.package != 'cws-overlay'
        working-directory: packages/core
        run: npm run build

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: npm ci
      
      - name: Lint
        working-directory: packages/${{ matrix.package }}
        run: npm run lint --if-present
      
      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: npm run build
      
      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: npm run test --if-present
